name: CI Acceptance & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests & Acoustic Acceptance Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Test Suite & Acoustic Gates
        run: |
          make audit

      - name: Upload Acceptance Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: logs/acceptance_report.json
          retention-days: 7
